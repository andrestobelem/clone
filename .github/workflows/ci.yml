name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Prepare environment
        run: uv sync --locked

      - name: Check Python
        run: |
          uv run python -m py_compile cli.py server.py workspace.py workspace_agents.py workspace_issues.py workspace_projects.py workspace_teams.py snapshot.py validation.py
          uv run python -m unittest discover -s tests -v

      - name: Check browser JavaScript
        run: |
          node --check app.js
          node --check npm/bin/clone.js
          node --test tests/test_ui.js tests/test_npm.js

      - name: Check repository diff
        run: git diff --check
