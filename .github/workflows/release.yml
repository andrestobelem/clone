name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build executable
        shell: bash
        run: |
          test "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)" = "$GITHUB_REF_NAME"
          test "v$(node -p "require('./npm/package.json').version")" = "$GITHUB_REF_NAME"
          uv sync --locked --group package
          uv run --group package python scripts/build-binary.py
          test -e "dist/bin/clone-${{ matrix.target }}" || test -e "dist/bin/clone-${{ matrix.target }}.exe"

      - name: Store executable
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: clone-${{ matrix.target }}
          path: dist/bin/clone-${{ matrix.target }}*
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Collect executables
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release
          sha256sum clone-* > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

  npm:
    name: Publish npm package
    needs: github-release
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package version
        shell: bash
        run: test "v$(node -p "require('./npm/package.json').version")" = "$GITHUB_REF_NAME"

      - name: Publish package
        working-directory: npm
        run: npm publish --access public
